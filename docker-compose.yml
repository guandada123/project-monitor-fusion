# ─── Project Monitor — Docker Compose ───
# 启动: docker compose up -d
# 停止: docker compose down
# 查看日志: docker compose logs -f
# 一键部署: bash deploy.sh
#
# 资源限制说明:
#   deploy.resources.limits.memory 由 Docker Swarm / Compose 强制执行。
#   如果宿主机内存充裕，可注释掉或调大限制值以获得更好性能。

services:
  # ─── PHP-FPM 应用 ───
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: project-monitor:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: "${APP_URL:-http://localhost:8000}"
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: project_monitor
      DB_USERNAME: project_monitor
      DB_PASSWORD: "${DB_PASSWORD:-secret}"
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      LOG_CHANNEL: stack
      LOG_LEVEL: warning
      FILESYSTEM_DISK: local
      APP_KEY: "${APP_KEY:-}"
    volumes:
      - app-storage:/var/www/storage
      # 2026-10-31：挂载 .env 让宿主修改即时生效。
      # 此前 .env 是构建时 COPY 进镜像的，容器里那份是旧副本 —— 宿主写了
      # APP_TIMEZONE=Asia/Shanghai，容器里没有这行 → 时区一直跑 UTC。
      # environment 已注入 DB_HOST 等关键项且优先级更高，故挂载只补缺失项，
      # 不会把容器内 DB_HOST 改回宿主值。挂单文件，宿主 .env 必须存在。
      - ./.env:/var/www/.env
      # 宿主数据只读挂载（2026-09-28）：容器里看不到宿主路径，这正是
      # `ops:health-scan` 6/6 恒失败、面板体积恒 0 的根因。路径可用 env 覆盖，
      # 见 config/ops.php。改这两处要保持 app 与 scheduler **一致**（同一份探测逻辑两处跑）。
      - /Users/guan/.workbuddy/workbuddy.db:/host/workbuddy.db:ro
      - /Users/guan/.ai_cost_log.jsonl:/host/ai_cost_log.jsonl:ro
      - /Users/guan/.workbuddy/cross_project_state.json:/host/cross_project_state.json:ro
      - ${WORKBUDDY_ROOT:-/Volumes/ZHITAI/WorkBuddy}:/host/WorkBuddy:ro
      # 2026-10-16 审计修复（P0，超出原审计清单；team-lead 复核后采纳本窄挂载方案）。
      #   原问题：nginx 侧 `root /var/www/public` 在该容器内根本不存在 → /build/**、/favicon.ico、
      #   /ops/** 全 404，容器化部署下 CSS/JS 从未加载。
      #   连带问题：PHP 侧靠 public/build/manifest.json 生成 <script src>，nginx 侧直接发文件，
      #   两侧必须是同一份产物，否则页面按镜像内旧 hash 取资源 → 仍然 404。
      #   故只挂 build 子目录（**不整挂 ./public**）：既让两侧产物一致，又保留镜像里
      #   烘焙的 public/storage -> /var/www/storage/app/public 软链
      #   （整目录挂载会被宿主 public/ 覆盖、丢掉该软链）。
      #   副作用（正面）：`npm run build` 后即时生效，无需重建 app 镜像。
      - ./public/build:/var/www/public/build:ro
    networks:
      - project-monitor
    healthcheck:
      test: ["CMD", "php", "-r", "echo @fsockopen('127.0.0.1', 9000) ? 'ok' : exit(1);"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  # ─── Nginx Web 服务器 ───
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      # 2026-10-13 安全收紧：绑 127.0.0.1（无局域网消费者，.env 无 192.168/10.x 引用）。
      #   注意：原为 ${NGINX_PORT:-8000} 而实际生效值 8080（.env 曾设置后注释），
      #   默认值已固化为 8080 防止重启静默漂移；远程访问走云反代 / Tailscale。
      #   回滚：将下行 "127.0.0.1:" 前缀去掉后 docker compose up -d nginx
      - "127.0.0.1:${NGINX_PORT:-8080}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - app-storage:/var/www/storage:ro
      # 2026-10-16 审计修复（P0，超出原审计清单 — 见提交说明）：
      #   nginx 侧 `root /var/www/public;` 指向的目录此前**在 nginx 容器内根本不存在**
      #   （本服务只挂了 default.conf 与 app-storage），导致 /build/**、/favicon.ico、
      #   /ops/** 全部 404 —— 即容器化部署下 CSS/JS 从未加载过（/login 有 200 但完全无样式）。
      #   public/ 已被 git 跟踪（含 public/build 构建产物），故只读挂进来即可；
      #   注意这会让 nginx 提供 **宿主** public/ 而非 app 镜像内那份（镜像内那份是构建期快照，
      #   实测停留在 Sep 28，比宿主旧）。改前端后必须 `npm run build` 再 `up -d --force-recreate nginx`。
      - ./public:/var/www/public:ro
    networks:
      - project-monitor
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 128M

  # ─── PostgreSQL 16 ───
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: project_monitor
      POSTGRES_USER: project_monitor
      POSTGRES_PASSWORD: "${DB_PASSWORD:-secret}"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - project-monitor
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U project_monitor -d project_monitor"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  # ─── 队列 Worker ───
  queue:
    image: project-monitor:latest
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      disable: true
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: project_monitor
      DB_USERNAME: project_monitor
      DB_PASSWORD: "${DB_PASSWORD:-secret}"
      QUEUE_CONNECTION: database
      LOG_CHANNEL: stack
      LOG_LEVEL: warning
      APP_KEY: "${APP_KEY:-}"
    command: [ "php", "artisan", "queue:work", "--tries=3", "--timeout=90", "--sleep=3" ]
    volumes:
      - app-storage:/var/www/storage
      # 2026-10-31：挂载 .env 让宿主修改即时生效。
      # 此前 .env 是构建时 COPY 进镜像的，容器里那份是旧副本 —— 宿主写了
      # APP_TIMEZONE=Asia/Shanghai，容器里没有这行 → 时区一直跑 UTC。
      # environment 已注入 DB_HOST 等关键项且优先级更高，故挂载只补缺失项，
      # 不会把容器内 DB_HOST 改回宿主值。挂单文件，宿主 .env 必须存在。
      - ./.env:/var/www/.env
    networks:
      - project-monitor
    deploy:
      resources:
        limits:
          memory: 256M

  # ─── 调度器 (Laravel 11 schedule:work) ───
  scheduler:
    image: project-monitor:latest
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      disable: true
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: project_monitor
      DB_USERNAME: project_monitor
      DB_PASSWORD: "${DB_PASSWORD:-secret}"
      QUEUE_CONNECTION: database
      LOG_CHANNEL: stack
      LOG_LEVEL: warning
      APP_KEY: "${APP_KEY:-}"
    command: [ "php", "artisan", "schedule:work" ]
    volumes:
      - app-storage:/var/www/storage
      # 2026-10-31：挂载 .env 让宿主修改即时生效。
      # 此前 .env 是构建时 COPY 进镜像的，容器里那份是旧副本 —— 宿主写了
      # APP_TIMEZONE=Asia/Shanghai，容器里没有这行 → 时区一直跑 UTC。
      # environment 已注入 DB_HOST 等关键项且优先级更高，故挂载只补缺失项，
      # 不会把容器内 DB_HOST 改回宿主值。挂单文件，宿主 .env 必须存在。
      - ./.env:/var/www/.env
      # 与 app 服务保持**同一份**宿主只读挂载：`ops:health-scan` 由本服务跑，
      # 少了这几行命令会退化成"全 N/A"（2026-09-28 修 6/6 恒失败时统一加上的）
      - /Users/guan/.workbuddy/workbuddy.db:/host/workbuddy.db:ro
      - /Users/guan/.ai_cost_log.jsonl:/host/ai_cost_log.jsonl:ro
      - /Users/guan/.workbuddy/cross_project_state.json:/host/cross_project_state.json:ro
      - ${WORKBUDDY_ROOT:-/Volumes/ZHITAI/WorkBuddy}:/host/WorkBuddy:ro
    networks:
      - project-monitor
    deploy:
      resources:
        limits:
          memory: 128M

volumes:
  pgdata:
    driver: local
  app-storage:
    driver: local

networks:
  project-monitor:
    driver: bridge
