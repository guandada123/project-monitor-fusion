# ─── Project Monitor — Nginx 配置 ───

# ─── 速率限制（防暴力破解）───
# 登录端点：每 IP 每分钟 5 次，突发允许 5 次（排队）
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

upstream php-fpm {
    server app:9000 max_fails=3 fail_timeout=10s;
}

server {
    listen 80;
    server_name _;
    root /var/www/public;
    index index.php;

    # ─── 字符集 ───
    charset utf-8;

    # ─── 安全头（升级版）───
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # ─── CSP（适配 Livewire + Alpine + Three.js + ApexCharts）───
    # unsafe-eval 用于 Alpine/Three.js 的 JS 求值; unsafe-inline 用于 Alpine x-init 和动态样式
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.bunny.net https://fonts.googleapis.com; img-src 'self' data: blob:; font-src 'self' https://fonts.bunny.net https://fonts.gstatic.com; connect-src 'self' wss:; worker-src 'none'; frame-ancestors 'none'; form-action 'self';" always;

    # ─── 日志 ───
    access_log /dev/stdout;
    error_log /dev/stderr;

    # ─── Gzip ───
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # ─── 静态资源 (缓存 1 年) ───
    # 注意：nginx 的 add_header 不做「继承合并」——只要本 location 内出现任意
    # 一条 add_header，server 级的 add_header 就全部失效。下面两条 location 为了
    # 设 Cache-Control 必须重复声明全部安全头，否则 /build/ 与 /favicon.ico 会静默
    # 丢掉 CSP / nosniff。改 server 级安全头时务必同步改这两处。
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.bunny.net https://fonts.googleapis.com; img-src 'self' data: blob:; font-src 'self' https://fonts.bunny.net https://fonts.gstatic.com; connect-src 'self' wss:; worker-src 'none'; frame-ancestors 'none'; form-action 'self';" always;

        try_files $uri =404;
    }

    location /favicon.ico {
        expires 1y;
        add_header Cache-Control "public, immutable" always;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.bunny.net https://fonts.googleapis.com; img-src 'self' data: blob:; font-src 'self' https://fonts.bunny.net https://fonts.gstatic.com; connect-src 'self' wss:; worker-src 'none'; frame-ancestors 'none'; form-action 'self';" always;

        log_not_found off;
        access_log off;
    }

    # ─── 健康检查 ───
    location /health.php {
        access_log off;
        include fastcgi_params;
        fastcgi_pass php-fpm;
        fastcgi_param SCRIPT_FILENAME $document_root/health.php;
    }

    # ─── Laravel ───
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ─── 登录限流 ───
    location = /login {
        limit_req zone=login burst=5 nodelay;
        limit_req_status 429;

        try_files $uri $uri/ /index.php?$query_string;
    }

    # ─── PHP 处理 ───
    location ~ \.php$ {
        fastcgi_pass php-fpm;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PHP_VALUE "error_log=/var/www/storage/logs/nginx-php-error.log";
        include fastcgi_params;

        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_read_timeout 120s;
    }

    # ─── 拒绝敏感文件 ───
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ \.(env|log|sqlite) {
        deny all;
        access_log off;
        log_not_found off;
    }
}
