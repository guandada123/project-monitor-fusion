# ─── Project Monitor — Docker Compose ───
# 启动: docker compose up -d
# 停止: docker compose down
# 查看日志: docker compose logs -f
# 一键部署: bash deploy.sh
#
# 资源限制说明:
#   deploy.resources.limits.memory 由 Docker Swarm / Compose 强制执行。
#   如果宿主机内存充裕，可注释掉或调大限制值以获得更好性能。

services:
  # ─── PHP-FPM 应用 ───
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: project-monitor:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: "${APP_URL:-http://localhost:8000}"
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: project_monitor
      DB_USERNAME: project_monitor
      DB_PASSWORD: "${DB_PASSWORD:-secret}"
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      LOG_CHANNEL: stack
      LOG_LEVEL: warning
      FILESYSTEM_DISK: local
      APP_KEY: "${APP_KEY:-}"
    volumes:
      - app-storage:/var/www/storage
    networks:
      - project-monitor
    healthcheck:
      test: ["CMD", "php", "-r", "echo @fsockopen('127.0.0.1', 9000) ? 'ok' : exit(1);"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  # ─── Nginx Web 服务器 ───
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${NGINX_PORT:-8000}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - app-storage:/var/www/storage:ro
    networks:
      - project-monitor
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 128M

  # ─── PostgreSQL 16 ───
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: project_monitor
      POSTGRES_USER: project_monitor
      POSTGRES_PASSWORD: "${DB_PASSWORD:-secret}"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - project-monitor
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U project_monitor -d project_monitor"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  # ─── 队列 Worker ───
  queue:
    image: project-monitor:latest
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: project_monitor
      DB_USERNAME: project_monitor
      DB_PASSWORD: "${DB_PASSWORD:-secret}"
      QUEUE_CONNECTION: database
      LOG_CHANNEL: stack
      LOG_LEVEL: warning
      APP_KEY: "${APP_KEY:-}"
    command: [ "php", "artisan", "queue:work", "--tries=3", "--timeout=90", "--sleep=3" ]
    volumes:
      - app-storage:/var/www/storage
    networks:
      - project-monitor
    deploy:
      resources:
        limits:
          memory: 256M

  # ─── 调度器 (Laravel 11 schedule:work) ───
  scheduler:
    image: project-monitor:latest
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: project_monitor
      DB_USERNAME: project_monitor
      DB_PASSWORD: "${DB_PASSWORD:-secret}"
      QUEUE_CONNECTION: database
      LOG_CHANNEL: stack
      LOG_LEVEL: warning
      APP_KEY: "${APP_KEY:-}"
    command: [ "php", "artisan", "schedule:work" ]
    volumes:
      - app-storage:/var/www/storage
    networks:
      - project-monitor
    deploy:
      resources:
        limits:
          memory: 128M

volumes:
  pgdata:
    driver: local
  app-storage:
    driver: local

networks:
  project-monitor:
    driver: bridge
