name: PMF CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # ────────────────────────────
  # PHP Lint
  # ────────────────────────────
  php-lint:
    name: PHP Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          tools: composer:v2
      - name: Prepare Laravel storage directories
        run: mkdir -p storage/framework/cache storage/framework/views storage/framework/sessions storage/logs
      - name: Install dependencies
        run: composer install --no-progress --no-interaction
      - name: Pint (Laravel code style)
        # 已验证本地 vendor/bin/pint --test 通过，恢复为硬阻断
        run: vendor/bin/pint --test

  # ────────────────────────────
  # PHP Static Analysis
  # ────────────────────────────
  phpstan:
    name: PHPStan Static Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          tools: composer:v2
      - name: Prepare Laravel storage directories
        run: mkdir -p storage/framework/cache storage/framework/views storage/framework/sessions storage/logs
      - name: Install dependencies
        run: composer install --no-progress --no-interaction
      - name: PHPStan
        # 必须显式加大内存：默认 128M 会让 parallel worker 直接崩溃退出，
        # 此前崩溃被 || echo warning 掩盖，导致静态分析长期形同虚设（结果标记为 incomplete）。
        # 已验证 1G 下 0 error，恢复为硬阻断
        run: vendor/bin/phpstan analyse --no-progress --no-interaction --memory-limit=1G

  # ────────────────────────────
  # PHP Unit Tests
  # ────────────────────────────
  phpunit:
    name: PHPUnit Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: project_monitor
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          tools: composer:v2
          extensions: pdo, pdo_pgsql, pgsql, mbstring, xml, json, fileinfo
      - name: Prepare Laravel directories
        run: mkdir -p storage/framework/cache storage/framework/views storage/framework/sessions storage/logs
      - name: Install dependencies
        run: composer install --no-progress --no-interaction
      - name: Configure environment
        run: |
          cp .env.example .env
          php artisan key:generate
          sed -i 's/DB_HOST=127.0.0.1/DB_HOST=localhost/' .env
          sed -i 's/DB_USERNAME=guan/DB_USERNAME=postgres/' .env
          sed -i 's/DB_PASSWORD=$/DB_PASSWORD=postgres/' .env
          sed -i 's/APP_ENV=local/APP_ENV=testing/' .env
          sed -i 's/CACHE_STORE=file/CACHE_STORE=array/' .env
          sed -i 's/LOG_LEVEL=debug/LOG_LEVEL=error/' .env
      - name: Create test database
        # 2026-10-24：测试库从 SQLite 切到 pgsql（phpunit.xml 强制
        # DB_DATABASE=project_monitor_test），必须独立建库：
        # RefreshDatabase 会 migrate:fresh，绝不能指向业务库。
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -tAc \
            "SELECT 1 FROM pg_database WHERE datname='project_monitor_test'" \
            | grep -q 1 \
            || psql -h localhost -U postgres -c "CREATE DATABASE project_monitor_test"
      - name: Run database migrations & seed
        run: php artisan migrate --seed
      - name: Run Pest tests
        # 原命令是 `phpunit`，但项目测试框架是 Pest：
        # vendor/bin/phpunit 是 Pest 的包装器，会抛 InvalidPestCommand 并提示改用 pest，
        # 且 CI 上 `phpunit` 并不在 PATH 中 —— 该 job 长期必然失败，
        # 只是被 || echo warning 掩盖成绿色，等于 367 个测试从未在 CI 真正执行过。
        # 已验证本地 vendor/bin/pest 全绿，恢复为硬阻断
        run: vendor/bin/pest --colors=never

  # ────────────────────────────
  # Frontend Build
  # ────────────────────────────
  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          tools: composer:v2
      - name: Install PHP dependencies (needed for Vite to resolve Flux CSS)
        run: |
          mkdir -p storage/framework/cache storage/framework/views storage/framework/sessions storage/logs
          composer install --no-dev --no-progress --no-interaction
      - name: Install Node dependencies
        run: npm ci
      - name: Build
        run: npm run build

  # ────────────────────────────
  # Security Scan
  # ────────────────────────────
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: npm audit
        run: |
          npm ci
          # 2026-10-24 收紧：此前 || echo warning 掩盖了 2 个 high 漏洞
          # （follow-redirects 1.16.0 / vite ≤6.4.3）。已通过 npm audit fix
          # 修到 follow-redirects 1.16.1 + vite 6.4.5（均为补丁级），本地复验 0 漏洞。
          npm audit --audit-level=high
      - name: Check for secrets (gitleaks)
        uses: gitleaks/gitleaks-action@v3
        with:
          config_path: .gitleaks.toml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Hardcoded credentials check
        run: |
          echo "=== 硬编码密钥检测 ==="
          matches=$(grep -rn "DB_PASSWORD\|API_KEY\|SECRET\|PASSWORD\s*=" \
            --include="*.php" --include="*.env" --include="*.yml" --include="*.yaml" \
            app/ config/ resources/ routes/ bootstrap/ 2>/dev/null | \
            grep -v 'env(' | \
            grep -v 'APP_KEY' | \
            grep -v 'DB_PASSWORD=changeme' | \
            grep -v 'CHANGEME' | \
            grep -v 'example' | \
            grep -v '//' | \
            grep -v '->env' | \
            grep -v "env()" | \
            grep -v "'env'") || true
          if [ -n "$matches" ]; then
            echo "⚠️ 发现潜在密钥:"
            echo "$matches"
            exit 1
          fi
          echo "✅ 未检测到硬编码密钥"

  # ────────────────────────────
  # Dusk Browser Tests
  # ────────────────────────────
  dusk:
    name: Dusk Browser Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: project_monitor
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          tools: composer:v2
          extensions: pdo, pdo_pgsql, pgsql, mbstring, xml, json, fileinfo
      - name: Install Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable
      - name: Prepare Laravel directories
        run: mkdir -p storage/framework/cache storage/framework/views storage/framework/sessions storage/logs
      - name: Install PHP dependencies
        run: composer install --no-progress --no-interaction
      - name: Install ChromeDriver
        run: |
          CHROME_VERSION=$(google-chrome-stable --version | grep -oP '\d+\.\d+\.\d+' | head -1)
          MAJOR=$(echo $CHROME_VERSION | cut -d. -f1)
          echo "Chrome version: $CHROME_VERSION (major: $MAJOR)"
          php artisan dusk:chrome-driver $MAJOR
      - name: Configure environment
        run: |
          cp .env.example .env
          php artisan key:generate
          # Clear cached config so APP_ENV=dusk takes effect for Dusk middleware
          php artisan optimize:clear
          sed -i 's/DB_HOST=127.0.0.1/DB_HOST=localhost/' .env
          sed -i 's/DB_USERNAME=guan/DB_USERNAME=postgres/' .env
          sed -i 's/DB_PASSWORD=$/DB_PASSWORD=postgres/' .env
          sed -i 's/APP_ENV=local/APP_ENV=dusk/' .env
          sed -i 's/APP_DEBUG=true/APP_DEBUG=false/' .env
          sed -i 's/CACHE_STORE=file/CACHE_STORE=array/' .env
          sed -i 's/LOG_LEVEL=debug/LOG_LEVEL=error/' .env
          # Keep SESSION_DRIVER=file so session persists between requests
          # (array driver would break loginAs() across page navigations)
      - name: Run database migrations & seed
        run: php artisan migrate --seed
      - name: Start dev server
        run: php artisan serve --port=8000 --no-reload &
      - name: Wait for dev server
        run: |
          for i in $(seq 1 30); do
            curl -s -o /dev/null http://localhost:8000 && echo "Server ready" && break
            sleep 1
          done
      - name: Verify Dusk environment
        run: |
          grep APP_ENV .env
          curl -s http://localhost:8000/up 2>/dev/null | head -20
      - name: Run Dusk tests
        # 2026-10-24：存量失败已修复，门禁收紧为硬阻断。
        # 根因：PostgreSQL 将未加引号的 SQL 别名折叠为小写，RiskManager::loadStats()
        # 的 selectRaw 别名 withSuggestion/noSuggestion 在 pgsql 下返回
        # withsuggestion/nosuggestion，视图访问 $stats['noSuggestion'] 抛
        # Undefined array key → /risks 页 500（SQLite 测试环境保留大小写故无法暴露）。
        # 修复：loadStats() 显式归一化键名（驱动无关）+ 视图加 ?? 0 防御。
        # 本地 pgsql 实测 37/37 通过；pgsql 覆盖由本 job 承担。
        run: php artisan dusk
      - name: Upload Dusk failure screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: dusk-failures-${{ github.run_id }}
          path: tests/Browser/screenshots/
