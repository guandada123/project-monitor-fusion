# Pre-commit hooks — Project Monitor Fusion (Laravel)
# Install: pip install pre-commit && pre-commit install
# Run: pre-commit run --all-files

# 2026-10-16：构建产物必须与 Vite 输出逐字节一致，否则每次 `npm run build`
# 都会产生新 diff（trailing-whitespace / end-of-file-fixer 会往压缩产物写换行）。
# 排除该目录；密钥扫描不受影响 —— gitleaks 钩子为 pass_filenames:false，自行扫描暂存区。
exclude: ^public/build/
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^(vendor/|node_modules/|storage/)
      - id: end-of-file-fixer
        exclude: ^(vendor/|node_modules/|storage/)
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-merge-conflict
      - id: detect-private-key
      - id: mixed-line-ending
        args: [--fix=lf]

  # Local PHP tools (installed via Composer)
  - repo: local
    hooks:
      - id: pint
        name: Laravel Pint
        entry: ./vendor/bin/pint --test
        language: script
        files: \.php$
        pass_filenames: false
        always_run: true

      - id: phpstan
        name: PHPStan
        entry: ./vendor/bin/phpstan analyse --no-progress --no-interaction
        language: script
        files: \.php$
        pass_filenames: false
        always_run: true

  # Secret 扫描
  - repo: local
    hooks:
      - id: gitleaks
        name: Gitleaks (secret scan)
        entry: gitleaks git --pre-commit --verbose
        language: system
        stages: [commit]
        always_run: true
        # 2026-10-16 修复：原先缺 pass_filenames: false —— pre-commit 会把暂存文件名
        # 追加为参数，而 `gitleaks git` 只接受 ≤1 个位置参数（仓库路径）→ 任何多文件
        # 提交都会 FTL "accepts at most 1 arg(s), received N"。gitleaks 的
        # `git --pre-commit` 模式本就自行扫描暂存区，无需文件名参数。
        pass_filenames: false
